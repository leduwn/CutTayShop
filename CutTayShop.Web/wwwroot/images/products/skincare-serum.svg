<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="serumBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </radialGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <filter id="serumShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#BE185D" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#serumBg)"/>
  <ellipse cx="150" cy="245" rx="70" ry="12" fill="#000000" opacity="0.08"/>
  <g transform="translate(100, 50)" filter="url(#serumShadow)">
    <!-- Dropper top -->
    <rect x="36" y="10" width="28" height="25" rx="6" fill="#F43F5E"/>
    <rect x="42" y="35" width="16" height="15" fill="#FDA4AF"/>
    <rect x="30" y="50" width="40" height="12" rx="4" fill="#E2E8F0"/>
    <!-- Bottle body -->
    <rect x="15" y="62" width="70" height="125" rx="14" fill="url(#glassGrad)"/>
    <!-- Label -->
    <rect x="23" y="90" width="54" height="65" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <line x1="30" y1="105" x2="70" y2="105" stroke="#E11D48" stroke-width="3" stroke-linecap="round"/>
    <line x1="33" y1="116" x2="67" y2="116" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="125" x2="64" y2="125" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <!-- Glow dot -->
    <circle cx="28" cy="75" r="4" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>
