<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="techBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </radialGradient>
    <filter id="mouseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0369A1" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#techBg)"/>
  <ellipse cx="150" cy="245" rx="65" ry="12" fill="#000000" opacity="0.08"/>
  <g transform="translate(100, 50)" filter="url(#mouseShadow)">
    <!-- Mouse body -->
    <path d="M 50 10 C 20 10, 10 50, 10 110 C 10 170, 25 190, 50 190 C 75 190, 90 170, 90 110 C 90 50, 80 10, 50 10 Z" fill="#0F172A"/>
    <!-- Mouse buttons divider -->
    <line x1="50" y1="10" x2="50" y2="70" stroke="#334155" stroke-width="2"/>
    <!-- Scroll wheel -->
    <rect x="46" y="30" width="8" height="24" rx="4" fill="#06B6D4"/>
    <!-- Subtle LED light strip -->
    <path d="M 25 150 C 35 160, 65 160, 75 150" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
