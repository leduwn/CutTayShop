<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="healthBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </radialGradient>
    <filter id="mgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#15803D" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#healthBg)"/>
  <ellipse cx="150" cy="245" rx="75" ry="12" fill="#000000" opacity="0.08"/>
  <g transform="translate(60, 60)" filter="url(#mgShadow)">
    <!-- Gun barrel head -->
    <circle cx="35" cy="55" r="24" fill="#0F172A"/>
    <!-- Gun horizontal body -->
    <rect x="45" y="32" width="100" height="46" rx="14" fill="#1E293B"/>
    <circle cx="125" cy="55" r="10" fill="#22C55E"/>
    <!-- Gun handle -->
    <rect x="95" y="70" width="38" height="95" rx="12" fill="#0F172A"/>
    <!-- Grip accents -->
    <line x1="102" y1="100" x2="126" y2="100" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="102" y1="115" x2="126" y2="115" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="102" y1="130" x2="126" y2="130" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <!-- Bottom base ring -->
    <rect x="91" y="160" width="46" height="12" rx="6" fill="#16A34A"/>
  </g>
</svg>
