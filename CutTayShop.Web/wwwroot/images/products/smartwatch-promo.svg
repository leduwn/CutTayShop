<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none" role="img" aria-label="Smartwatch Công nghệ Cao cấp">
  <defs>
    <filter id="swRealShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.10" />
    </filter>
    <!-- Deep Pine / Sage Green Silicone Sport Strap Gradient -->
    <linearGradient id="swPineStrapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D5A3F" />
      <stop offset="35%" stop-color="#1A4329" />
      <stop offset="70%" stop-color="#143621" />
      <stop offset="100%" stop-color="#0B2014" />
    </linearGradient>
    <linearGradient id="swCaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="swScreenGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <!-- Ambient Contact Shadow on Mint Canvas -->
  <ellipse cx="100" cy="182" rx="60" ry="10" fill="#064E3B" opacity="0.16" />

  <!-- Complete Smartwatch Assembly in 3D perspective -->
  <g transform="translate(48, 12)" filter="url(#swRealShadow)">
    <!-- Top Strap Loop -->
    <path d="M 22 28 C 22 10, 82 10, 82 28 L 80 48 L 24 48 Z" fill="url(#swPineStrapGrad)" />
    <!-- Strap Adjustment Pin Slot -->
    <rect x="50" y="20" width="4" height="12" rx="2" fill="#0B2014" opacity="0.65" />

    <!-- Bottom Strap Loop -->
    <path d="M 24 125 L 80 125 L 82 155 C 82 172, 22 172, 22 155 Z" fill="url(#swPineStrapGrad)" />

    <!-- Watch Case (Space Gray / Titanium Curvature) -->
    <rect x="12" y="38" width="80" height="96" rx="26" fill="url(#swCaseGrad)" stroke="#64748B" stroke-width="1.5" />

    <!-- Digital Crown & Side Button -->
    <rect x="91" y="58" width="6" height="18" rx="3" fill="#64748B" stroke="#334155" stroke-width="1" />
    <rect x="91" y="86" width="4" height="16" rx="2" fill="#334155" />

    <!-- Curved AMOLED Display Panel -->
    <rect x="18" y="44" width="68" height="84" rx="20" fill="#000000" />
    <!-- Glass Reflection Arc -->
    <rect x="18" y="44" width="68" height="84" rx="20" fill="url(#swScreenGloss)" />

    <!-- UI: Time Display "10:09" (Exact to Reference) -->
    <text x="52" y="78" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.03em">10</text>
    <text x="52" y="103" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.03em">09</text>

    <!-- UI: Complication Metrics (Activity Rings & Dots) -->
    <circle cx="34" cy="116" r="3" fill="#10B981" />
    <circle cx="44" cy="116" r="3" fill="#F59E0B" />
    <circle cx="54" cy="116" r="3" fill="#EF4444" />
    <circle cx="68" cy="116" r="4.5" stroke="#38BDF8" stroke-width="2" fill="none" />
  </g>
</svg>
