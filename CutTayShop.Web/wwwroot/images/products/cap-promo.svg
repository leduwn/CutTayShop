<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none" role="img" aria-label="Mũ Lưỡi Trai Phong Cách 2026">
  <defs>
    <filter id="capRealShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.16" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <linearGradient id="capDomeGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="45%" stop-color="#F3ECE0" />
      <stop offset="85%" stop-color="#E5D9C7" />
      <stop offset="100%" stop-color="#D5C4AE" />
    </linearGradient>
    <linearGradient id="capVisorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE7DA" />
      <stop offset="50%" stop-color="#E2D4C0" />
      <stop offset="100%" stop-color="#CBB79E" />
    </linearGradient>
  </defs>

  <!-- Ambient Contact Shadow on Warm Peach Canvas -->
  <ellipse cx="102" cy="178" rx="68" ry="12" fill="#451A03" opacity="0.14" />

  <!-- 3D Angled Dad Cap Assembly -->
  <g transform="translate(24, 25)" filter="url(#capRealShadow)">
    <!-- Rear Arch Hint -->
    <path d="M 28 95 C 24 75, 42 62, 54 62" stroke="#B8A790" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4" />

    <!-- 6-Panel Structured Cap Crown -->
    <path d="M 32 108 C 28 38, 128 32, 134 108 C 102 112, 56 112, 32 108 Z" fill="url(#capDomeGrad)" stroke="#D8C9B4" stroke-width="1.2" />

    <!-- Panel Seam Stitching -->
    <path d="M 82 40 L 48 108" stroke="#D1BEA5" stroke-width="1.2" stroke-dasharray="3 2" />
    <path d="M 82 40 L 82 110" stroke="#D1BEA5" stroke-width="1.2" stroke-dasharray="3 2" />
    <path d="M 82 40 L 118 108" stroke="#D1BEA5" stroke-width="1.2" stroke-dasharray="3 2" />

    <!-- Embroidered Eyelets (Clean Hex: #E8DECB) -->
    <circle cx="58" cy="74" r="2.5" fill="#E8DECB" stroke="#B8A790" stroke-width="1" />
    <circle cx="82" cy="68" r="2.5" fill="#E8DECB" stroke="#B8A790" stroke-width="1" />
    <circle cx="106" cy="74" r="2.5" fill="#E8DECB" stroke="#B8A790" stroke-width="1" />

    <!-- Top Covered Squatchee Button -->
    <ellipse cx="82" cy="40" rx="7" ry="5" fill="#D5C4AE" stroke="#B8A790" stroke-width="1" />

    <!-- Signature Front Crown Embroidered Smiley Face ☺ (Exact to Reference) -->
    <g transform="translate(71, 74)">
      <circle cx="11" cy="11" r="10" stroke="#1E293B" stroke-width="2" fill="none" />
      <circle cx="7.5" cy="9" r="1.5" fill="#1E293B" />
      <circle cx="14.5" cy="9" r="1.5" fill="#1E293B" />
      <path d="M 7 13 Q 11 17.5 15 13" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>

    <!-- Curved Visor / Bill -->
    <path d="M 22 104 C 15 116, 25 132, 65 138 C 110 144, 150 134, 154 116 C 132 106, 52 100, 22 104 Z" fill="url(#capVisorGrad)" stroke="#CBB79E" stroke-width="1.2" />

    <!-- Visor Parallel Stitch Lines -->
    <path d="M 32 112 C 45 125, 95 132, 142 116" stroke="#D1BEA5" stroke-width="1.2" stroke-dasharray="4 2" fill="none" />
    <path d="M 38 118 C 52 128, 92 135, 134 122" stroke="#D1BEA5" stroke-width="1.2" stroke-dasharray="4 2" fill="none" />

    <!-- Highlight reflection on top curve of visor -->
    <path d="M 34 108 C 50 105, 115 106, 144 114" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>
</svg>
