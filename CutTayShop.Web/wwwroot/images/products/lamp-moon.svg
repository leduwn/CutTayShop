<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="lampGlow" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="60%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </radialGradient>
    <filter id="moonFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#FBBF24" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="#F8FAFC"/>
  <ellipse cx="150" cy="255" rx="70" ry="12" fill="#000000" opacity="0.08"/>
  <!-- Wooden Stand -->
  <g transform="translate(100, 180)">
    <polygon points="10,40 50,20 30,5" fill="#B45309"/>
    <polygon points="50,20 90,40 70,5" fill="#78350F"/>
    <polygon points="10,40 50,55 90,40 50,20" fill="#92400E"/>
  </g>
  <!-- 3D Moon Sphere -->
  <g filter="url(#moonFilter)">
    <circle cx="150" cy="130" r="65" fill="url(#lampGlow)"/>
    <!-- Craters -->
    <circle cx="130" cy="115" r="14" fill="#FCD34D" opacity="0.4"/>
    <circle cx="170" cy="140" r="10" fill="#FCD34D" opacity="0.4"/>
    <circle cx="145" cy="160" r="8" fill="#FCD34D" opacity="0.3"/>
  </g>
</svg>
