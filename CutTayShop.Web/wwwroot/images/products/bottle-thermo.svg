<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="btlBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5F8DC"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </radialGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="flaskShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#059669" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#btlBg)"/>
  <ellipse cx="150" cy="255" rx="55" ry="10" fill="#000000" opacity="0.08"/>
  <g transform="translate(115, 40)" filter="url(#flaskShadow)">
    <!-- Cap -->
    <rect x="18" y="5" width="34" height="25" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="22" y="28" width="26" height="8" rx="2" fill="#CBD5E1"/>
    <!-- Bottle Body -->
    <path d="M 12 36 L 58 36 C 66 36, 68 45, 68 55 L 68 185 C 68 200, 2 200, 2 185 L 2 55 C 2 45, 4 36, 12 36 Z" fill="url(#flaskGrad)"/>
    <!-- Highlight Reflection -->
    <path d="M 12 55 L 12 180" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <!-- Cute CutTay logo on bottle -->
    <circle cx="35" cy="110" r="10" fill="#FFFFFF" opacity="0.25"/>
    <text x="35" y="114" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle" fill="#FFFFFF">CT</text>
  </g>
</svg>
