<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="toyBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </radialGradient>
    <filter id="toyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#047857" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#toyBg)"/>
  <ellipse cx="150" cy="245" rx="70" ry="12" fill="#000000" opacity="0.08"/>
  <g transform="translate(85, 45)" filter="url(#toyShadow)">
    <!-- Antenna -->
    <line x1="65" y1="10" x2="65" y2="30" stroke="#059669" stroke-width="4"/>
    <circle cx="65" cy="8" r="6" fill="#F59E0B"/>
    <!-- Head -->
    <rect x="35" y="30" width="60" height="45" rx="10" fill="#10B981"/>
    <rect x="45" y="42" width="14" height="12" rx="4" fill="#0F172A"/>
    <rect x="71" y="42" width="14" height="12" rx="4" fill="#0F172A"/>
    <circle cx="52" cy="48" r="2.5" fill="#34D399"/>
    <circle cx="78" cy="48" r="2.5" fill="#34D399"/>
    <line x1="52" y1="64" x2="78" y2="64" stroke="#065F46" stroke-width="3" stroke-linecap="round"/>
    <!-- Neck -->
    <rect x="58" y="75" width="14" height="8" rx="2" fill="#047857"/>
    <!-- Body -->
    <rect x="25" y="83" width="80" height="70" rx="12" fill="#059669"/>
    <rect x="38" y="95" width="54" height="35" rx="6" fill="#ECFDF5"/>
    <circle cx="52" cy="112" r="5" fill="#EF4444"/>
    <circle cx="65" cy="112" r="5" fill="#F59E0B"/>
    <circle cx="78" cy="112" r="5" fill="#3B82F6"/>
    <!-- Arms -->
    <rect x="10" y="90" width="12" height="40" rx="6" fill="#10B981"/>
    <circle cx="16" cy="135" r="7" fill="#047857"/>
    <rect x="108" y="90" width="12" height="40" rx="6" fill="#10B981"/>
    <circle cx="114" cy="135" r="7" fill="#047857"/>
    <!-- Legs -->
    <rect x="38" y="153" width="20" height="30" rx="6" fill="#047857"/>
    <rect x="72" y="153" width="20" height="30" rx="6" fill="#047857"/>
  </g>
