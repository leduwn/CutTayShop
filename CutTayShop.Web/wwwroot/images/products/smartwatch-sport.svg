<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="swBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </radialGradient>
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="swShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0369A1" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#swBg)"/>
  <ellipse cx="150" cy="255" rx="75" ry="12" fill="#000000" opacity="0.08"/>
  <g transform="translate(100, 30)" filter="url(#swShadow)">
    <!-- Top Strap -->
    <path d="M 22 10 L 22 70 L 78 70 L 78 10 Z" fill="url(#bandGrad)" rx="6"/>
    <!-- Bottom Strap -->
    <path d="M 22 170 L 22 230 L 78 230 L 78 170 Z" fill="url(#bandGrad)" rx="6"/>
