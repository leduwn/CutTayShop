    <rect x="5" y="60" width="90" height="120" rx="28" fill="#0F172A" stroke="#334155" stroke-width="3"/>
    <rect x="12" y="68" width="76" height="104" rx="22" fill="#020617"/>
    <!-- Crown button -->
    <rect x="96" y="95" width="6" height="22" rx="3" fill="#64748B"/>
    <!-- Display Graphics -->
    <text x="50" y="112" font-family="system-ui, sans-serif" font-weight="700" font-size="22" text-anchor="middle" fill="#FFFFFF">10:42</text>
    <text x="50" y="130" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#38BDF8">THỨ TƯ · 28/10</text>
    <!-- Activity ring -->
