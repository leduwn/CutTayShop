<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="capBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </radialGradient>
    <filter id="capShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#D97706" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#capBg)"/>
  <ellipse cx="150" cy="245" rx="85" ry="12" fill="#000000" opacity="0.08"/>
  <g transform="translate(60, 80)" filter="url(#capShadow)">
    <!-- Cap Dome -->
    <path d="M 30 110 C 30 20, 150 20, 150 110 Z" fill="#D97706"/>
    <path d="M 90 25 L 90 110" stroke="#B45309" stroke-width="2" stroke-dasharray="3 3"/>
    <!-- Button top -->
    <circle cx="90" cy="25" r="7" fill="#B45309"/>
    <!-- Visor / Brim -->
    <path d="M 25 105 C 10 110, 5 125, 45 135 C 95 145, 160 135, 175 110 C 145 105, 50 100, 25 105 Z" fill="#B45309"/>
    <!-- Embroidered Letter -->
    <text x="90" y="75" font-family="system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="middle" fill="#FEF3C7">C</text>
  </g>
</svg>
