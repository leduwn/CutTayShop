<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="gymBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </radialGradient>
    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
    <filter id="gymShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5B21B6" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#gymBg)"/>
  <ellipse cx="150" cy="245" rx="80" ry="12" fill="#000000" opacity="0.08"/>
  <g transform="translate(60, 95)" filter="url(#gymShadow)">
    <!-- Dumbbell bar -->
    <rect x="25" y="45" width="130" height="20" rx="6" fill="#94A3B8"/>
    <line x1="70" y1="45" x2="70" y2="65" stroke="#64748B" stroke-width="2"/>
    <line x1="80" y1="45" x2="80" y2="65" stroke="#64748B" stroke-width="2"/>
    <line x1="90" y1="45" x2="90" y2="65" stroke="#64748B" stroke-width="2"/>
    <line x1="100" y1="45" x2="100" y2="65" stroke="#64748B" stroke-width="2"/>
    <line x1="110" y1="45" x2="110" y2="65" stroke="#64748B" stroke-width="2"/>
    <!-- Left Plate Outer -->
    <rect x="5" y="10" width="22" height="90" rx="10" fill="url(#ironGrad)"/>
    <rect x="23" y="20" width="14" height="70" rx="7" fill="#6D28D9"/>
    <!-- Right Plate Outer -->
    <rect x="153" y="10" width="22" height="90" rx="10" fill="url(#ironGrad)"/>
    <rect x="143" y="20" width="14" height="70" rx="7" fill="#6D28D9"/>
  </g>
</svg>
