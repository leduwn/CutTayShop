<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="toteBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </radialGradient>
    <filter id="toteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#C2410C" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#toteBg)"/>
  <ellipse cx="150" cy="245" rx="75" ry="12" fill="#000000" opacity="0.08"/>
  <g transform="translate(75, 45)" filter="url(#toteShadow)">
    <!-- Straps -->
    <path d="M 45 70 C 45 15, 105 15, 105 70" stroke="#9A3412" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Bag body -->
    <path d="M 20 70 L 130 70 L 120 185 L 30 185 Z" fill="#FDBA74"/>
    <!-- Front pocket -->
    <rect x="40" y="95" width="70" height="60" rx="8" fill="#FB923C"/>
    <!-- Cute heart graphic -->
    <path d="M 75 125 A 6 6 0 0 0 65 119 A 6 6 0 0 0 75 133 A 6 6 0 0 0 85 119 A 6 6 0 0 0 75 125 Z" fill="#FFFFFF"/>
  </g>
</svg>
