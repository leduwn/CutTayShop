<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bpBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <filter id="bpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#bpBg)"/>
  <ellipse cx="150" cy="255" rx="75" ry="12" fill="#000000" opacity="0.08"/>
  <g transform="translate(80, 50)" filter="url(#bpShadow)">
    <!-- Top Handle -->
    <path d="M 50 30 C 50 15, 90 15, 90 30" stroke="#334155" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Bag Main Body -->
    <rect x="15" y="30" width="110" height="150" rx="32" fill="#1E293B"/>
    <!-- Front Pocket -->
    <rect x="25" y="100" width="90" height="70" rx="16" fill="#334155"/>
    <path d="M 35 115 L 105 115" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <!-- Accent Tag -->
    <rect x="90" y="145" width="16" height="6" rx="2" fill="#10B981"/>
  </g>
</svg>
