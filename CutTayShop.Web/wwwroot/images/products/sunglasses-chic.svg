<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="accBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </radialGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#B45309" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#accBg)"/>
  <ellipse cx="150" cy="245" rx="80" ry="12" fill="#000000" opacity="0.08"/>
  <g transform="translate(45, 95)" filter="url(#glassShadow)">
    <!-- Bridge -->
    <path d="M 95 35 Q 105 28 115 35" stroke="#D97706" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Left Lens Frame -->
    <rect x="15" y="20" width="80" height="60" rx="18" fill="#B45309"/>
    <rect x="20" y="25" width="70" height="50" rx="14" fill="url(#lensGrad)"/>
    <!-- Right Lens Frame -->
    <rect x="115" y="20" width="80" height="60" rx="18" fill="#B45309"/>
    <rect x="120" y="25" width="70" height="50" rx="14" fill="url(#lensGrad)"/>
    <!-- Left Temple arm tip -->
    <path d="M 15 28 Q 0 15 -10 20" stroke="#B45309" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Right Temple arm tip -->
    <path d="M 195 28 Q 210 15 220 20" stroke="#B45309" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
