<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bookBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </radialGradient>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7E22CE" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#bookBg)"/>
  <ellipse cx="150" cy="245" rx="75" ry="12" fill="#000000" opacity="0.08"/>
  <g transform="translate(75, 45)" filter="url(#bookShadow)">
    <!-- Book cover -->
    <rect x="10" y="10" width="130" height="180" rx="8" fill="#7E22CE"/>
    <!-- Spine binding -->
    <rect x="10" y="10" width="18" height="180" rx="6" fill="#581C87"/>
    <!-- Gold Foil Bookmark Ribbon -->
    <path d="M 100 10 L 100 90 L 110 80 L 120 90 L 120 10 Z" fill="#F59E0B"/>
    <!-- Embossed Title Line -->
    <rect x="45" y="60" width="70" height="6" rx="3" fill="#E9D5FF"/>
    <rect x="45" y="74" width="45" height="4" rx="2" fill="#E9D5FF" opacity="0.7"/>
    <!-- Pen beside book -->
    <g transform="translate(142, 35)">
      <rect x="0" y="10" width="8" height="120" rx="4" fill="#0F172A"/>
      <path d="M 0 130 L 4 145 L 8 130 Z" fill="#D97706"/>
      <circle cx="4" cy="18" r="3" fill="#D97706"/>
    </g>
  </g>
</svg>
