<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="hpBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="hpMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="hpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#hpBg)"/>
  <ellipse cx="150" cy="245" rx="90" ry="14" fill="#000000" opacity="0.08"/>
  <g transform="translate(50, 45)" filter="url(#hpShadow)">
    <!-- Headband -->
    <path d="M 25 120 C 25 35, 175 35, 175 120" stroke="url(#hpMetal)" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M 45 80 C 70 50, 130 50, 155 80" stroke="#059669" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>
    <!-- Left Ear Cup -->
    <g transform="translate(10, 100)">
      <rect x="0" y="0" width="36" height="70" rx="18" fill="#1E293B"/>
      <rect x="6" y="8" width="24" height="54" rx="12" fill="#0F172A"/>
      <circle cx="18" cy="35" r="7" fill="#10B981"/>
    </g>
    <!-- Right Ear Cup -->
    <g transform="translate(154, 100)">
      <rect x="0" y="0" width="36" height="70" rx="18" fill="#1E293B"/>
      <rect x="6" y="8" width="24" height="54" rx="12" fill="#0F172A"/>
      <circle cx="18" cy="35" r="7" fill="#10B981"/>
    </g>
  </g>
</svg>
