<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 210" width="220" height="210" fill="none">
  <defs>
    <!-- Paper shadow filter -->
    <filter id="sticker-shadow" x="-15%" y="-10%" width="135%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.08" />
    </filter>
    <filter id="tape-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <g transform="rotate(-4.5 110 105)">
    <!-- Paper note body with soft organic corners -->
    <path d="M 22 18 
             C 45 16, 170 17, 196 20 
             C 200 21, 202 24, 201 32 
             C 199 80, 203 145, 200 185 
             C 199 191, 195 194, 188 193 
             C 135 190, 60 193, 24 188 
             C 18 187, 16 182, 17 175 
             C 18 120, 16 55, 18 26 
             C 18 20, 20 18, 22 18 Z" 
          fill="#FAF8F5" 
          stroke="#EAE4DC" 
          stroke-width="1.2" 
          filter="url(#sticker-shadow)" />

    <!-- Subtle paper inner border / texture highlight -->
    <path d="M 25 24 L 194 26 L 197 187 L 22 183 Z" fill="none" stroke="#F0EAE1" stroke-width="0.75" opacity="0.6"/>

    <!-- Pin / Washi Tape at Top Center -->
    <rect x="85" y="8" width="46" height="18" rx="2" 
          fill="#F5EFE6" 
          fill-opacity="0.82" 
          stroke="#D8CEBE" 
          stroke-width="0.8" 
          transform="rotate(2 108 17)"
          filter="url(#tape-shadow)" />

    <!-- Typography -->
    <text x="110" y="66" 
          text-anchor="middle" 
          font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="26" 
          font-weight="800" 
          letter-spacing="-0.03em" 
          fill="#1C1917">Good</text>

    <text x="110" y="100" 
          text-anchor="middle" 
          font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="26" 
          font-weight="800" 
          letter-spacing="-0.03em" 
          fill="#1C1917">Products</text>

    <text x="110" y="136" 
          text-anchor="middle" 
          font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="25" 
          font-weight="800" 
          letter-spacing="-0.02em" 
          fill="#1C1917">Brighter</text>

    <g transform="translate(110, 172)">
      <text x="-12" y="0" 
            text-anchor="middle" 
            font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="25" 
            font-weight="800" 
            letter-spacing="-0.02em" 
            fill="#1C1917">Days</text>
      <!-- Playful Smiley Face -->
      <g transform="translate(30, -8) scale(0.9)">
        <circle cx="0" cy="0" r="11" fill="none" stroke="#1C1917" stroke-width="2" />
        <circle cx="-3.5" cy="-2.5" r="1.5" fill="#1C1917" />
        <circle cx="3.5" cy="-2.5" r="1.5" fill="#1C1917" />
        <path d="M -5.5 2 Q 0 8 5.5 2" fill="none" stroke="#1C1917" stroke-width="1.8" stroke-linecap="round" />
      </g>
    </g>
  </g>
</svg>

