<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" fill="none">
  <defs>
    <!-- Gradients for realistic architectural plaster blocks -->
    <linearGradient id="podium-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBE5DB" />
      <stop offset="100%" stop-color="#DFD8CD" />
    </linearGradient>
    <linearGradient id="podium-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7D0C4" />
      <stop offset="100%" stop-color="#C5BEB1" />
    </linearGradient>
    <linearGradient id="podium-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CCC4B6" />
      <stop offset="100%" stop-color="#B8AF9F" />
    </linearGradient>

    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5DFC</h2>" />
      <stop offset="0%" stop-color="#EDE7DD" />
      <stop offset="100%" stop-color="#E2DCD1" />
    </linearGradient>
    <linearGradient id="cube-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D8D1C3" />
      <stop offset="100%" stop-color="#C2BBAE" />
    </linearGradient>

    <!-- Ambient contact shadow on floor -->
    <radialGradient id="block-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D2A26" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#2D2A26" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#2D2A26" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Floor contact shadow -->
  <ellipse cx="220" cy="340" rx="190" ry="35" fill="url(#block-shadow)" />

  <!-- Rear Tall Block (Behind Plant/Left) -->
  <g id="tall-rear-block">
    <!-- Top Face -->
    <polygon points="110,130 200,105 250,135 160,160" fill="url(#podium-top)" />
    <!-- Front/Right Face -->
    <polygon points="160,160 250,135 250,320 160,345" fill="url(#podium-side)" />
    <!-- Front/Left Face -->
    <polygon points="110,130 160,160 160,345 110,315" fill="url(#podium-front)" />
    <!-- Subtle Edge Highlight -->
    <line x1="160" y1="160" x2="160" y2="345" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.2" />
    <line x1="110" y1="130" x2="160" y2="160" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" />
  </g>

  <!-- Front Lower Display Platform / Step (Behind/Underneath Headphones) -->
  <g id="lower-podium">
    <!-- Top Face -->
    <polygon points="190,210 330,175 390,215 250,250" fill="url(#cube-top)" />
    <!-- Front/Right Face -->
    <polygon points="250,250 390,215 390,340 250,375" fill="url(#podium-side)" />
    <!-- Front/Left Face -->
    <polygon points="190,210 250,250 250,375 190,335" fill="url(#cube-front)" />
    <!-- Subtle Edge Highlight -->
    <line x1="250" y1="250" x2="250" y2="375" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.2" />
    <line x1="190" y1="210" x2="250" y2="250" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1" />
    <line x1="250" y1="250" x2="390" y2="215" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="0.8" />
  </g>
</svg>

